# Company C blind-test configuration (Oil & Gas E&P operator: Bluestem Production / Midstream / Gas & Oil).
# Generated by `spendcube profile` and tuned via the 14-item checklist in docs/BLIND_DAY.md.
include: ["../configs/_llm.yaml"]
company: C
candidate_name: jaygautam
reporting_currency: USD
industry_hint: "Upstream and midstream oil & gas E&P operator: drilling and completions, well services and workover, artificial lift, saltwater disposal and water hauling, gas compression, production chemicals, MRO supplies, facilities, IT and professional services"
input_dir: "blind/C"

taxonomy:
  file: "{input_dir}/category_tree_C.csv"
  format: wide
  path_separator: " > "

sources:
  - name: lines
    role: primary
    file: "{input_dir}/invoice_lines.csv"
    read: {delimiter: ",", encoding: auto}
    record_id: {column: "line_id", prefix: ""}
    columns:
      supplier_name: "supplier_name"
      description: ["line_description", "product_service_description", "invoice_description"]
      material_id: "product_service_code"
      quantity: "quantity"
      uom: "uom"
      amount: "line_amount_usd"
      amount_basis: net
      currency_constant: USD
      invoice_date: {column: "invoice_date", dayfirst: false}
      status: "status"
      invoice_number: "invoice_number"
      gl_description: "gl_account_description"
      context: ["submission_type", "buyer_entity", "invoice_description"]
      llm_context: ["submission_type", "buyer_entity"]
    status_map:
      INCLUDE: ["Approved"]
      CANCELLED: ["Cancelled"]
      NOT_APPROVED: []
      default: INCLUDE
    intra_source_dedup: {enabled: false}

fx:
  files: []
  plausibility_band: [0.5, 2.0]
  static_rates: {}

exclusion_rules:
  # Protect genuine consulting/legal/advisory lines that mention tax, debt, or receivables
  - {code: NON_PROCUREMENT, field: gl_desc, equals: ["Consulting Services", "Litigation", "Non Recurring Expense", "Government Affairs", "General Representation", "Accounting Services", "Investor Services", "LOE - Regulatory/Legal Expenses"], action: include}
  - {code: NON_PROCUREMENT, field: desc_raw, regex: "(?i)\\b(tax\\s+consult|legal\\s+services|billable\\s+hours|advisory\\s+services|tax\\s+included)\\b", action: include}
  # 1. Explicit Non-Procurement GL accounts: taxes, royalties, revenue, JIB partner billings ("Energy" = Image Post JIBs), donations, payroll deductions, director fees
  - {code: NON_PROCUREMENT, field: gl_desc, equals: [
      "AR Revenue Deposits Clearing",
      "Gas Revenue - Marketing",
      "LOE-Saltwater Disposal Revenue",
      "Other O&G Revenue",
      "Gas Rev. - Internal Transp & Compres",
      "Accrued Severance Taxes",
      "Accrued Ad Valorem Taxes",
      "LOE - Impact Fee & Other Tax",
      "MMS Royalty Payable",
      "State Royalty Payable",
      "Energy",
      "AR JIB Deposits Clearing",
      "Donations",
      "Employee Deductions Payable",
      "Director Fees"
    ]}
  # 2. Image Post submission_type = Joint Interest Billing (JIB) partner vouchers
  - {code: NON_PROCUREMENT, field: ctx__submission_type, equals: ["Image Post"]}
  # 3. Miscellaneous Receivable Image OBO intercompany/partner netting entries (legal services on this GL are protected above)
  - {code: NON_PROCUREMENT, field: gl_desc, equals: ["Miscellaneous Receivable - Accrual", "Miscellaneous Receivable"]}
  # 4. Explicit standalone tax lines (Heavy Equipment Inventory Tax, Sales Tax, Ad Valorem Tax, TAX ONLY)
  - {code: NON_PROCUREMENT, field: desc_raw, regex: "(?i)^\\s*(heavy\\s+equipment\\s+inventory\\s+tax|sales\\s+tax\\s+connected\\s+to\\s+purchase|ad\\s+valorem(\\s+tax)?|ad\\s+volerem|tax\\s+only)\\b"}
  - {code: NON_PROCUREMENT, field: desc_raw, regex: "(?i)^\\s*tax\\s+tax\\b"}
  - {code: NON_PROCUREMENT, field: ctx__invoice_description, regex: "(?i)^\\s*(sales\\s+tax|2024\\s+ad\\s+valorem\\s+taxes|tax\\s+only)\\s*$"}
  - {code: NON_PROCUREMENT, field: ctx__invoice_description, regex: "(?i)\\bJIB\\s+Voucher\\b"}

vendor_propagation: {enabled: false, min_share: 0.9, min_rows: 3, codes: [NON_PROCUREMENT]}

entities:
  use_labels: false
  suppliers: {mode: auto, fuzzy: true, jw_min: 0.95, ratio_min: 92, max_len_diff: 3, min_len: 5, block_cap: 300, vendor_union: true, vendor_min_sim: 50}
  items:
    generic_min_texts: 8
    generic_min_ratio: 0.15
    generic_ids: ["PRODUCT", "Product", "Product/Service", "Material", "MATERIAL", "Labor", "FREIGHT", "[PERSON]", "1", "PR", "Misc.-"]
    fuzzy: true
    fuzzy_ratio: 93
    fuzzy_min_len: 10
    block_cap: 300
    link_share: 0.6
    merge_materials_by_text: false

null_description_tokens: ["PRODUCT", "PRODUCT/SERVICE", "TOTAL INVOICE AMOUNT REPRESENTING UNITEMIZED CHARGES"]

labels: null
classification:
  llm: {enabled: true}
  blank: {enabled: true, mode: vote_first, vote_min_share: 0.6, cap: 0.6, min_known: 30}
output: {float_decimals: 2}
